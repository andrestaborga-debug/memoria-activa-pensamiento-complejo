<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Penales</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>⚽ Penales</h1>
  <p class="subtitulo">Prototipo standalone — 5 zonas, jugadas ocultas, reglas de definición mundialista.</p>

  <section class="tarjeta" id="tarjeta-auth">
    <h2 id="titulo-auth">Ingresar</h2>
    <label for="username">Usuario</label>
    <input type="text" id="username" autocomplete="username" />
    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" />
    <div class="error" id="error-auth"></div>
    <button id="btn-login">Ingresar</button>
    <button id="btn-signup" class="secundario">Crear cuenta</button>
  </section>

  <section class="tarjeta" id="tarjeta-lobby" style="display:none">
    <h2>Hola, <span id="nombre-usuario"></span> 👋</h2>

    <button id="btn-crear">Crear partida</button>
    <div id="bloque-codigo" style="display:none">
      <p>Compartí este código con tu rival:</p>
      <div class="codigo-partida" id="codigo-creado"></div>
      <button id="btn-ir-a-partida">Entrar a la partida</button>
    </div>

    <label for="input-codigo">Unirme con un código</label>
    <input type="text" id="input-codigo" maxlength="6" placeholder="ABC123" style="text-transform:uppercase" />
    <button id="btn-unirse" class="secundario">Unirme</button>

    <div class="error" id="error-lobby"></div>
    <button id="btn-logout" class="secundario">Salir</button>
  </section>

  <script src="auth.js"></script>
</body>
</html>
